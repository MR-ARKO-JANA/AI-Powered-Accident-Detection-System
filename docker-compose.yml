version: '3.8'

services:
  # Node.js Backend
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    depends_on:
      mongodb:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/api/status', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Python AI Service
  ai-service:
    build: ./ai-service
    ports:
      - "5001:5001"
    restart: unless-stopped
    volumes:
      - ./ai-service/model:/app/model

  # React Frontend
  frontend:
    build: ./frontend/my-app
    ports:
      - "3000:3000"
    stdin_open: true
    restart: unless-stopped
    environment:
      - CHOKIDAR_USEPOLLING=true

  # MongoDB
  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

  # Redis Message Broker
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  # Celery Background Worker
  celery-worker:
    build: ./ai-service
    command: celery -A tasks.celery worker --loglevel=info
    restart: unless-stopped
    volumes:
      - ./ai-service/model:/app/model
    depends_on:
      - redis
      - backend

volumes:
  mongo_data:
